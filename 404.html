<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı — Külünk Teknoloji</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;700&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gradient-hero);
      text-align: center;
      padding: var(--space-8);
    }
    .error-code {
      font-family: var(--font-display);
      font-size: clamp(6rem, 20vw, 14rem);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px var(--color-primary-500);
      margin-bottom: var(--space-4);
      opacity: 0.4;
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: var(--text-4xl);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--space-4);
    }
    .error-desc {
      font-size: var(--text-lg);
      color: var(--color-text-muted);
      max-width: 40ch;
      margin-inline: auto;
      margin-bottom: var(--space-10);
      line-height: var(--leading-relaxed);
    }
    .error-actions {
      display: flex;
      gap: var(--space-4);
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1 class="error-title">Sayfa Bulunamadı</h1>
      <p class="error-desc">Aradığınız sayfa taşınmış, silinmiş veya hiç var olmamış olabilir.</p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary btn-lg">Ana Sayfaya Dön</a>
        <a href="/blog/" class="btn btn-outline btn-lg">Blogu İncele</a>
      </div>
    </div>
  </div>
</body>
</html>
